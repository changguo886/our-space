<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Our Space · 陪伴小猫（坐姿招手）· 用于「今日陪伴」 -->
  <defs>
    <clipPath id="cs-head"><ellipse cx="100" cy="82" rx="58" ry="48"/></clipPath>
    <clipPath id="cs-body"><path d="M58 128 Q46 200 70 204 L130 204 Q154 200 142 128 Z"/></clipPath>
  </defs>
  <g stroke="#5E4E47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="100" cy="207" rx="62" ry="7" fill="#5E4E47" opacity=".1" stroke="none"/>

    <!-- tail curled around -->
    <path d="M136 196 C168 200 182 178 172 160 C168 152 160 156 164 164 C170 178 156 188 136 184" fill="#FFFCF6"/>
    <path d="M168 162 L176 168 M166 176 L176 178" stroke="#B8876A" stroke-width="4"/>

    <!-- body -->
    <path d="M58 128 Q46 200 70 204 L130 204 Q154 200 142 128 Z" fill="#FFFCF6"/>
    <g clip-path="url(#cs-body)" stroke="none">
      <path d="M120 150 C140 146 156 160 152 184 L120 186 C112 172 112 160 120 150 Z" fill="#D7A585"/>
      <ellipse cx="72" cy="176" rx="16" ry="12" fill="#8F8A86" opacity=".8"/>
    </g>
    <path d="M58 128 Q46 200 70 204 L130 204 Q154 200 142 128" fill="none"/>
    <path d="M100 160 L100 200" stroke-width="2.5" opacity=".35"/>

    <!-- paws -->
    <ellipse cx="82" cy="200" rx="14" ry="8" fill="#FFFCF6"/>
    <ellipse cx="118" cy="200" rx="14" ry="8" fill="#FFFCF6"/>
    <path d="M78 198 L78 203 M86 198 L86 203 M114 198 L114 203 M122 198 L122 203" stroke-width="2" opacity=".5"/>

    <!-- waving arm -->
    <path d="M136 140 Q160 128 164 104 Q166 94 174 98 Q182 102 176 114 Q168 140 142 156" fill="#FFFCF6"/>
    <path d="M168 99 L170 92 M174 100 L178 94" stroke-width="2" opacity=".5"/>

    <!-- scarf -->
    <path d="M52 120 Q100 146 148 120 L150 134 Q100 160 50 134 Z" fill="#E6C27A"/>
    <path d="M66 136 Q60 156 64 172 L78 168 Q76 152 80 140 Z" fill="#E6C27A"/>
    <path d="M65 172 L64 178 M71 171 L71 177 M77 169 L78 175" stroke="#C9A35A" stroke-width="2"/>

    <!-- ears -->
    <path d="M52 56 Q44 18 76 34" fill="#D7A585"/>
    <path d="M58 50 Q56 30 70 38" fill="#F2C3B6" stroke="none"/>
    <path d="M124 34 Q156 18 148 56" fill="#FFFCF6"/>
    <path d="M130 38 Q146 30 142 50" fill="#F2C3B6" stroke="none"/>

    <!-- head -->
    <ellipse cx="100" cy="82" rx="58" ry="48" fill="#FFFCF6"/>
    <g clip-path="url(#cs-head)" stroke="none">
      <path d="M36 36 L92 34 C86 56 72 68 52 72 L36 76 Z" fill="#D7A585"/>
      <path d="M128 30 L166 40 L166 82 C152 72 140 60 132 48 Z" fill="#8F8A86" opacity=".85"/>
    </g>
    <ellipse cx="100" cy="82" rx="58" ry="48" fill="none"/>

    <!-- face -->
    <path d="M70 86 Q78 77 86 86" fill="none"/>
    <path d="M114 86 Q122 77 130 86" fill="none"/>
    <ellipse cx="66" cy="102" rx="10" ry="6.5" fill="#F2B6AC" opacity=".75" stroke="none"/>
    <ellipse cx="134" cy="102" rx="10" ry="6.5" fill="#F2B6AC" opacity=".75" stroke="none"/>
    <path d="M96 94 L104 94 L100 99 Z" fill="#E59A93" stroke-width="2"/>
    <path d="M92 103 Q96 109 100 103 Q104 109 108 103" fill="none" stroke-width="2.5"/>
    <path d="M56 96 L38 93 M56 102 L38 104 M144 96 L162 93 M144 102 L162 104" stroke-width="2" opacity=".6"/>
  </g>
</svg>
